name: Regional market integrity tests
on:
  push:
    paths:
      - market_catalog.py
      - apac_data.py
      - market.js
      - tests/**
      - .github/workflows/regional-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCOUT_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile market_catalog.py apac_data.py scanner.py research.py
      - name: Validate market UI syntax
        run: node --check market.js
      - name: Test entire Scout codebase without network or secrets
        run: python -m unittest discover -s tests -v
