name: Scout regional catalogue bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regional-bootstrap.yml
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
concurrency:
  group: scout-regional-bootstrap
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NZXPLORER_API_KEY: ${{ secrets.NZXPLORER_API_KEY }}
      SEABEE_API_KEY: ${{ secrets.SEABEE_API_KEY }}
      SCOUT_NZX_PRICE_DAILY_LIMIT: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh independent exchange company catalogue
        run: python market_catalog.py
      - name: Refresh a small validated sample of regional EOD prices
        run: python apac_data.py
      - name: Publish separate NZX research and forward-only observation history
        run: python nzx_research.py
      - name: Save regional data only when fresher than remote snapshots
        run: |
          mkdir -p /tmp/scout-regional
          cp data/market_catalog.json /tmp/scout-regional/market_catalog.json
          cp data/apac.json /tmp/scout-regional/apac.json
          cp data/nzx_research.json /tmp/scout-regional/nzx_research.json
          cp data/nzx_history.json /tmp/scout-regional/nzx_history.json
          git config user.name "scout-regional-bootstrap-bot"
          git config user.email "scout-regional-bootstrap-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          for name in ("market_catalog.json","apac.json","nzx_research.json","nzx_history.json"):
              incoming=Path('/tmp/scout-regional')/name
              destination=Path('data')/name
              fresh=json.loads(incoming.read_text())
              try:
                  current=json.loads(destination.read_text())
              except (OSError,ValueError):
                  current={}
              if name=='nzx_history.json':
                  # Remote history may have acquired later prospective calls.
                  # Merge by identity, keeping all original snapshots and outcomes.
                  if current:
                      old_obs={(o['symbol'],o['date']):o for o in current.get('observations',[])
                               if isinstance(o,dict) and 'symbol' in o and 'date' in o}
                      old_calls={o['id']:o for o in current.get('calls',[])
                                 if isinstance(o,dict) and 'id' in o}
                      for o in fresh.get('observations',[]):
                          old_obs.setdefault((o['symbol'],o['date']),o)
                      for o in fresh.get('calls',[]):
                          if o['id'] not in old_calls:
                              old_calls[o['id']]=o
                          else:
                              old_calls[o['id']].update({k:v for k,v in o.items()
                                                        if k.endswith('_observed_on') or
                                                        k.startswith('change_')})
                      fresh['observations']=list(old_obs.values())[-20000:]
                      fresh['calls']=list(old_calls.values())[-2000:]
                  destination.write_text(json.dumps(fresh,indent=2)+'\\n')
                  print(name,': prospective NZX observations merged')
                  continue
              if str(current.get('generated_at','')) > str(fresh.get('generated_at','')):
                  print(name,': preserved newer remote file')
                  continue
              destination.write_text(incoming.read_text())
              print(name,': refreshed without modifying US research or learning')
          PY
            git add data/market_catalog.json data/apac.json data/nzx_research.json data/nzx_history.json
            if git diff --cached --quiet; then break; fi
            git commit -m "Refresh independent NZX and ASX discovery and EOD research"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
