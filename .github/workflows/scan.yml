name: Refresh Scout data and site
on:
  schedule:
    # Best-effort hourly UTC; GitHub sometimes delays or skips runs.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan.yml'
      - 'scanner.py'
      - 'research.py'
      - 'ml_engine.py'
      - 'learner.py'
      - 'app.js'
      - 'market.js'
      - 'market_catalog.py'
      - 'apac_data.py'
      - 'stocksdeepdive.py'
      - 'compass.js'
      - 'results.js'
      - 'trade_journal.py'
      - 'style.css'
      - 'index.html'
      - 'config/watchlist.json'
      - 'scripts/post_reports.py'
      - 'sw.js'
      - 'tests/**'
permissions:
  contents: write
  issues: write
concurrency:
  group: scout-data-and-pages
  # Do not cancel a successful research run halfway through committing data.
  cancel-in-progress: false
jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    # Retain access to any API keys stored as environment secrets.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check research scanner tests
        run: python -m unittest discover -s tests -v
      - name: Review learning outcomes (weekly, NZ time)
        run: python learner.py
      - name: Update exchange directories (US, ASX, optional NZX)
        continue-on-error: true
        env:
          NZXPLORER_API_KEY: ${{ secrets.NZXPLORER_API_KEY }}
        run: python market_catalog.py
      - name: Collect read-only ASX and NZX daily price research
        continue-on-error: true
        env:
          NZXPLORER_API_KEY: ${{ secrets.NZXPLORER_API_KEY }}
          SEABEE_API_KEY: ${{ secrets.SEABEE_API_KEY }}
        run: python apac_data.py
      - name: Collect free StocksDeepDive research (read-only)
        continue-on-error: true
        run: python stocksdeepdive.py
      - name: Check public sources
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner.py
      - name: Save snapshot for next run
        run: |
          # Save the new scan before synchronizing an up-to-date remote commit.
          # A job queued before another deploy must never lose the fresh dataset.
          cp data/market_catalog.json /tmp/scout-market-catalog.json
          cp data/apac.json /tmp/scout-apac.json
          cp data/stocksdeepdive.json /tmp/scout-stocksdeepdive.json
          cp data/latest.json /tmp/scout-latest.json
          cp data/research_cache.json /tmp/scout-cache.json
          cp data/history.json /tmp/scout-history.json
          cp data/weekly.json /tmp/scout-weekly.json
          cp data/ml_model.json /tmp/scout-model.json
          cp data/ml_report.json /tmp/scout-ml-report.json
          git config user.name "scout-data-bot"
          git config user.email "scout-data-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/scout-market-catalog.json data/market_catalog.json
            cp /tmp/scout-apac.json data/apac.json
            cp /tmp/scout-stocksdeepdive.json data/stocksdeepdive.json
            cp /tmp/scout-latest.json data/latest.json
            cp /tmp/scout-cache.json data/research_cache.json
            cp /tmp/scout-history.json data/history.json
            cp /tmp/scout-weekly.json data/weekly.json
            cp /tmp/scout-model.json data/ml_model.json
            cp /tmp/scout-ml-report.json data/ml_report.json
            git add data/stocksdeepdive.json data/apac.json data/market_catalog.json data/latest.json data/research_cache.json data/history.json data/weekly.json data/ml_model.json data/ml_report.json
            if git diff --cached --quiet; then
              echo "Research snapshot already saved"
              break
            fi
            git commit -m "Refresh Scout research snapshot"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Snapshot push unsuccessful after 3 attempts"
              exit 1
            fi
          done
      - name: Publish time-sensitive and weekly research notifications
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/post_reports.py
      # GitHub Pages is configured for branch-based deployment and independently
      # publishes changes to main. Do not upload/deploy another Pages artifact here.
      # Avoids duplicate deployments and intermittent missing-artifact races.
