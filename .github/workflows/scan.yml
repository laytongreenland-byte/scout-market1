name: Refresh Scout data and site
on:
  schedule:
    # Best-effort hourly UTC; GitHub sometimes delays or skips runs.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scout-data-and-pages
  cancel-in-progress: false
jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public sources
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner.py
      - name: Save snapshot for next run
        run: |
          git config user.name "scout-data-bot"
          git config user.email "scout-data-bot@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh market research snapshot"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p site/assets site/data
          cp index.html style.css app.js sw.js manifest.webmanifest site/
          cp assets/icon.svg site/assets/
          cp data/latest.json site/data/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
