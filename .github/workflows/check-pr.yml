name: Verify Scout changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scanner.py research.py price_plan.py ml_engine.py learner.py
      - name: Check JavaScript syntax
        run: node --check app.js && node --check compass.js && node --check results.js && node --check market.js
      - name: Run research, pricing and learning tests
        run: python -m unittest discover -s tests -v
